components:
  schemas:
    AccountBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AccountBody.json
          format: uri
          readOnly: true
          type: string
        account:
          description: Account external id (unique per owner).
          type: string
        confirmed_balance:
          description: "Final balance: the sum of all CONFIRMED operations (the object of guarantee G1)."
          format: int64
          type: integer
        max_balance:
          description: Maximum final balance; null = unbounded.
          format: int64
          type: integer
        min_balance:
          description: Minimum final balance; null = unbounded.
          format: int64
          type: integer
        version:
          description: Optimistic-lock version; bumped by the processor on every confirmation and by limit updates.
          format: int64
          type: integer
      required:
        - account
        - min_balance
        - max_balance
        - confirmed_balance
        - version
      type: object
    CreateAccountInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateAccountInputBody.json
          format: uri
          readOnly: true
          type: string
        external_id:
          description: Client-defined account external id (unique per owner).
          minLength: 1
          type: string
        max_balance:
          description: Maximum final balance; omit or null for unbounded.
          format: int64
          type: integer
        min_balance:
          description: Minimum final balance; omit or null for unbounded.
          format: int64
          type: integer
      required:
        - external_id
      type: object
    CreateTransactionInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateTransactionInputBody.json
          format: uri
          readOnly: true
          type: string
        operations:
          description: One operation is a single; 2..max_group_size operations form an atomic group (§10.1).
          items:
            $ref: "#/components/schemas/OperationInput"
          minItems: 1
          type:
            - array
            - "null"
        wait_ms:
          description: Optional synchronous wait budget in milliseconds. 0 or omitted returns 202 immediately (fire-and-forget); query the outcome later. When > 0 the call waits up to this many ms (capped by api_max_wait_ms) for the decision — 200 with the decided status if it lands in time, otherwise 202 with the current (still PENDING) state. Waiting is best-effort, never a guaranteed outcome.
          format: int64
          minimum: 0
          type: integer
      required:
        - operations
      type: object
    CreateTransactionOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateTransactionOutputBody.json
          format: uri
          readOnly: true
          type: string
        operations:
          items:
            $ref: "#/components/schemas/OperationOutcome"
          type:
            - array
            - "null"
        replayed:
          description: True when this request replayed an existing idempotency key and wrote no new rows (G6).
          type: boolean
        transaction_id:
          description: Group transaction id; absent for a single operation.
          format: int64
          type: integer
        transaction_status:
          description: "Group status: PENDING | COMMITTED | REJECTED; absent for a single operation."
          type: string
      required:
        - operations
        - replayed
      type: object
    EditOperationInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EditOperationInputBody.json
          format: uri
          readOnly: true
          type: string
        account:
          description: "External id of an account of the same owner; created on demand with unbounded limits. Omitted: unchanged."
          minLength: 1
          type: string
        amount:
          description: "New amount (non-zero). Omitted: unchanged."
          format: int64
          type: integer
        effective_at:
          description: "New timeline instant (RFC 3339), past or future. Omitted: unchanged."
          format: date-time
          type: string
        expected_revision:
          description: "Optional optimistic guard (>= 1): the edit is rejected with STALE_REVISION unless the operation is at exactly this revision when the edit is decided."
          format: int32
          type: integer
        wait_ms:
          description: "Optional synchronous wait budget in milliseconds, same semantics as POST /transactions: 0 or omitted returns 202 immediately; > 0 waits up to this many ms (capped by api_max_wait_ms) for the decision — 200 with the decided status if it lands in time, otherwise 202 with the current (still PENDING) state."
          format: int64
          minimum: 0
          type: integer
      type: object
    EditOutcome:
      additionalProperties: false
      properties:
        id:
          description: Registration id of the edit; GET /operations/{id} reads it back.
          format: int64
          type: integer
        operation_id:
          description: The edited operation (the id in the request path).
          format: int64
          type: integer
        rejection:
          $ref: "#/components/schemas/Rejection"
          description: Machine-readable rejection detail; present only when the edit is INVALID.
        status:
          description: "Edit status: PENDING | APPLIED | INVALID."
          type: string
      required:
        - id
        - status
        - operation_id
      type: object
    EditOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EditOutputBody.json
          format: uri
          readOnly: true
          type: string
        edit:
          $ref: "#/components/schemas/EditOutcome"
        replayed:
          description: True when this request replayed an existing idempotency key and wrote no new rows (G6).
          type: boolean
      required:
        - edit
        - replayed
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GetBalanceOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/GetBalanceOutputBody.json
          format: uri
          readOnly: true
          type: string
        account:
          type: string
        at:
          description: The instant the balance is measured at; absent for the final balance.
          format: date-time
          type: string
        balance:
          description: Final balance, or the point-in-time projection when at was supplied.
          format: int64
          type: integer
      required:
        - account
        - balance
      type: object
    GetOperationOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/GetOperationOutputBody.json
          format: uri
          readOnly: true
          type: string
        account:
          description: Account external id (current value; for an edit, the proposed one).
          type: string
        amount:
          description: Signed amount in minor units (e.g. cents); positive is a credit, negative a debit. Integer only — fractional or exponent values are rejected. Values are int64 and may exceed JavaScript's safe-integer range (2^53); clients that use JS numbers can lose precision and should treat the field as a string or bigint.
          format: int64
          type: integer
        edit_of:
          description: "Present only on an edit registration: the operation it edits."
          format: int64
          type: integer
        effective_at:
          description: Timeline instant (current value; for an edit, the proposed one).
          format: date-time
          type: string
        expected_revision:
          description: Present only on an edit registration that carries an optimistic guard.
          format: int32
          type: integer
        id:
          format: int64
          type: integer
        rejection:
          $ref: "#/components/schemas/Rejection"
          description: Machine-readable rejection detail; present only when the row is INVALID.
        revision:
          description: Current revision of a regular operation (1 until its first applied edit); absent on an edit registration.
          format: int32
          type: integer
        status:
          description: "Operation status: PENDING | CONFIRMED | INVALID; an edit registration is PENDING | APPLIED | INVALID."
          type: string
        transaction_id:
          description: Group transaction id if this operation is a group leg; absent for a single.
          format: int64
          type: integer
      required:
        - id
        - status
        - account
        - amount
        - effective_at
      type: object
    GetTransactionOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/GetTransactionOutputBody.json
          format: uri
          readOnly: true
          type: string
        id:
          format: int64
          type: integer
        op_count:
          format: int64
          type: integer
        operations:
          items:
            $ref: "#/components/schemas/LegStatus"
          type:
            - array
            - "null"
        rejection:
          $ref: "#/components/schemas/Rejection"
          description: Machine-readable rejection detail; present only when the group was REJECTED.
        status:
          description: "Group status: PENDING | COMMITTED | REJECTED."
          type: string
      required:
        - id
        - status
        - op_count
        - operations
      type: object
    LegStatus:
      additionalProperties: false
      properties:
        edit_of:
          description: "Present only on an edit leg: the operation it edits."
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        rejection:
          $ref: "#/components/schemas/Rejection"
          description: Machine-readable rejection detail; present only when the group was REJECTED.
        revision:
          description: Current revision of a regular leg (1 until its first applied edit); absent on an edit leg.
          format: int32
          type: integer
        status:
          description: "Operation status: PENDING | CONFIRMED | INVALID; an edit leg is PENDING | APPLIED | INVALID."
          type: string
      required:
        - id
        - status
      type: object
    OperationHistoryOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/OperationHistoryOutputBody.json
          format: uri
          readOnly: true
          type: string
        current_revision:
          format: int32
          type: integer
        operation_id:
          format: int64
          type: integer
        pending_edits:
          description: Undecided edits targeting this operation, in registration-id order.
          items:
            $ref: "#/components/schemas/PendingEdit"
          type:
            - array
            - "null"
        rejected_edits:
          description: Rejected (INVALID) edits targeting this operation, in registration-id order.
          items:
            $ref: "#/components/schemas/RejectedEdit"
          type:
            - array
            - "null"
        revisions:
          description: Ordered by revision; the last entry is the current state.
          items:
            $ref: "#/components/schemas/RevisionEntry"
          type:
            - array
            - "null"
        status:
          description: "Operation status: PENDING | CONFIRMED | INVALID."
          type: string
      required:
        - operation_id
        - status
        - current_revision
        - revisions
        - pending_edits
        - rejected_edits
      type: object
    OperationInput:
      additionalProperties: false
      properties:
        account:
          description: Client-defined account external id (unique per owner). Upserted on demand with unbounded limits if it does not exist. Required on a new operation; on an edit item, omitted means unchanged.
          minLength: 1
          type: string
        amount:
          description: Signed amount in minor units (e.g. cents); positive is a credit, negative a debit. Integer only — fractional or exponent values are rejected. Values are int64 and may exceed JavaScript's safe-integer range (2^53); clients that use JS numbers can lose precision and should treat the field as a string or bigint.
          format: int64
          type: integer
        edit_of:
          description: "Makes this item an edit of the named operation (ADR-0010): the group applies it atomically with its other items, netting all changes per account. The target must be a regular operation of this owner; two items may not edit the same operation."
          format: int64
          type: integer
        effective_at:
          description: Timeline timestamp (RFC 3339). May be in the past (backdated) or future; it never affects validation, only where the operation lands on the timeline (§5.4). Required on a new operation; on an edit item, omitted means unchanged.
          format: date-time
          type: string
        expected_revision:
          description: "Edit items only. Optional optimistic guard (>= 1): the group is rejected with STALE_REVISION unless the target is at exactly this revision when decided."
          format: int32
          type: integer
        reversal_of:
          description: Registration id of the operation this reverses. Immutable metadata, unused by the engine (§5.4). Not allowed on an edit item.
          format: int64
          type: integer
      type: object
    OperationOutcome:
      additionalProperties: false
      properties:
        edit_of:
          description: "Present only on an edit item: the operation it edits."
          format: int64
          type: integer
        id:
          description: Registration id — the global insertion order and the timeline tiebreaker.
          format: int64
          type: integer
        status:
          description: "Operation status: PENDING | CONFIRMED | INVALID; an edit item is PENDING | APPLIED | INVALID."
          type: string
      required:
        - id
        - status
      type: object
    PendingEdit:
      additionalProperties: false
      properties:
        account:
          type: string
        amount:
          description: Signed amount in minor units (e.g. cents); positive is a credit, negative a debit. Integer only — fractional or exponent values are rejected. Values are int64 and may exceed JavaScript's safe-integer range (2^53); clients that use JS numbers can lose precision and should treat the field as a string or bigint.
          format: int64
          type: integer
        effective_at:
          format: date-time
          type: string
        expected_revision:
          format: int32
          type: integer
        id:
          description: Registration id of the edit.
          format: int64
          type: integer
      required:
        - id
        - account
        - amount
        - effective_at
      type: object
    RejectedEdit:
      additionalProperties: false
      properties:
        account:
          type: string
        amount:
          description: Signed amount in minor units (e.g. cents); positive is a credit, negative a debit. Integer only — fractional or exponent values are rejected. Values are int64 and may exceed JavaScript's safe-integer range (2^53); clients that use JS numbers can lose precision and should treat the field as a string or bigint.
          format: int64
          type: integer
        decided_at:
          format: date-time
          type: string
        effective_at:
          format: date-time
          type: string
        expected_revision:
          format: int32
          type: integer
        id:
          description: Registration id of the edit.
          format: int64
          type: integer
        rejection:
          $ref: "#/components/schemas/Rejection"
      required:
        - id
        - account
        - amount
        - effective_at
        - decided_at
        - rejection
      type: object
    Rejection:
      additionalProperties: false
      properties:
        account:
          type: string
        actual_revision:
          format: int32
          type: integer
        code:
          type: string
        expected_revision:
          format: int32
          type: integer
        limit_side:
          type: string
        operation_id:
          format: int64
          type: integer
        shortfall:
          format: int64
          type: integer
      required:
        - code
      type: object
    RevisionEntry:
      additionalProperties: false
      properties:
        account:
          description: Account external id at this revision.
          type: string
        amount:
          description: Signed amount in minor units (e.g. cents); positive is a credit, negative a debit. Integer only — fractional or exponent values are rejected. Values are int64 and may exceed JavaScript's safe-integer range (2^53); clients that use JS numbers can lose precision and should treat the field as a string or bigint.
          format: int64
          type: integer
        effective_at:
          format: date-time
          type: string
        recorded_at:
          description: "When this revision became current: registration for revision 1, the applying edit's decision instant afterwards."
          format: date-time
          type: string
        revision:
          format: int32
          type: integer
        superseded_at:
          description: When this revision stopped being current; absent on the current revision.
          format: date-time
          type: string
        superseded_by:
          description: Registration id of the APPLIED edit that superseded this revision; absent on the current revision.
          format: int64
          type: integer
      required:
        - revision
        - account
        - amount
        - effective_at
        - recorded_at
      type: object
    StatementEntry:
      additionalProperties: false
      properties:
        amount:
          description: Signed amount in minor units (e.g. cents); positive is a credit, negative a debit. Integer only — fractional or exponent values are rejected. Values are int64 and may exceed JavaScript's safe-integer range (2^53); clients that use JS numbers can lose precision and should treat the field as a string or bigint.
          format: int64
          type: integer
        effective_at:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        reversal_of:
          format: int64
          type: integer
        revision:
          description: "Current revision of the operation: 1 for a never-edited operation."
          format: int32
          type: integer
        running_balance:
          description: Cumulative confirmed balance up to and including this operation, in timeline order.
          format: int64
          type: integer
        transaction_id:
          format: int64
          type: integer
      required:
        - id
        - amount
        - effective_at
        - running_balance
        - revision
      type: object
    StatementOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/StatementOutputBody.json
          format: uri
          readOnly: true
          type: string
        account:
          type: string
        entries:
          items:
            $ref: "#/components/schemas/StatementEntry"
          type:
            - array
            - "null"
        next_cursor:
          description: Pass as ?cursor= to fetch the next page; absent on the last page.
          type: string
      required:
        - account
        - entries
      type: object
    UpdateLimitsInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateLimitsInputBody.json
          format: uri
          readOnly: true
          type: string
        max_balance:
          description: New maximum final balance; omit or null for unbounded. Replaces the existing value (PUT).
          format: int64
          type: integer
        min_balance:
          description: New minimum final balance; omit or null for unbounded. Replaces the existing value (PUT).
          format: int64
          type: integer
      type: object
info:
  description: "BalanceDB — a Postgres-backed balance-maintenance engine (ledger). Clients insert money operations (singles or atomic groups); a single elected processor selects visible committed work in ID order and validates it so an account's final balance never breaks its configured limits. Insertion is asynchronous: POST /transactions returns 202 and outcomes are queried later."
  title: BalanceDB API
  version: 1.1.0
openapi: 3.1.0
paths:
  /accounts:
    post:
      description: Accounts are also created on demand at insertion; this endpoint creates one explicitly, with optional min/max balance limits (null = unbounded). Returns 409 if the account already exists.
      operationId: createAccount
      parameters:
        - description: Owner scope (§2).
          in: header
          name: X-Owner-Id
          required: true
          schema:
            description: Owner scope (§2).
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create an account explicitly with optional limits
      tags:
        - Accounts
  /accounts/{ext}/balance:
    get:
      description: Without ?at, returns the final balance (sum of all CONFIRMED operations; the object of guarantee G1). With ?at=T, returns the derived balance at instant T — a projection that may violate configured limits (non-guarantee N2), including at T=now() when future-dated operations exist (N5).
      operationId: getBalance
      parameters:
        - description: Owner scope (§2).
          in: header
          name: X-Owner-Id
          required: true
          schema:
            description: Owner scope (§2).
            type: string
        - description: Account external id.
          in: path
          name: ext
          required: true
          schema:
            description: Account external id.
            type: string
        - description: Optional RFC 3339 instant. When set, returns the derived balance at that instant (a projection that may violate limits, N2) instead of the final balance.
          explode: false
          in: query
          name: at
          schema:
            description: Optional RFC 3339 instant. When set, returns the derived balance at that instant (a projection that may violate limits, N2) instead of the final balance.
            format: date-time
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBalanceOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get an account's final balance, or a point-in-time projection with ?at=T
      tags:
        - Queries
  /accounts/{ext}/limits:
    put:
      description: Sets both min_balance and max_balance (omit a field or send null for unbounded). Per §6 a new min is accepted only if min <= confirmed_balance and a new max only if confirmed_balance <= max. The update is optimistically guarded on the same version the processor bumps; a lost race is retried once, then returns 409.
      operationId: updateAccountLimits
      parameters:
        - description: Owner scope (§2).
          in: header
          name: X-Owner-Id
          required: true
          schema:
            description: Owner scope (§2).
            type: string
        - description: Account external id.
          in: path
          name: ext
          required: true
          schema:
            description: Account external id.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLimitsInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Replace an account's balance limits (§6 rules, version-guarded)
      tags:
        - Accounts
  /accounts/{ext}/statement:
    get:
      description: "Pages over the CONFIRMED timeline in (effective_at, id) order (guarantee G4), seeded from the balance snapshot preceding the page. Keyset pagination: pass the returned next_cursor to fetch the following page."
      operationId: getStatement
      parameters:
        - description: Owner scope (§2).
          in: header
          name: X-Owner-Id
          required: true
          schema:
            description: Owner scope (§2).
            type: string
        - description: Account external id.
          in: path
          name: ext
          required: true
          schema:
            description: Account external id.
            type: string
        - description: Maximum entries per page.
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum entries per page.
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - description: Opaque keyset cursor from a previous page's next_cursor. Omit for the first page.
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque keyset cursor from a previous page's next_cursor. Omit for the first page.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a paged account statement with a derived running balance
      tags:
        - Queries
  /operations/{id}:
    get:
      operationId: getOperation
      parameters:
        - description: Owner scope (§2).
          in: header
          name: X-Owner-Id
          required: true
          schema:
            description: Owner scope (§2).
            type: string
        - description: Operation (registration) id.
          in: path
          name: id
          required: true
          schema:
            description: Operation (registration) id.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetOperationOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get an operation's status, current values and revision (or an edit registration's proposed state) and, if INVALID, its rejection detail
      tags:
        - Queries
    patch:
      description: "Registers one edit against the operation: a registration in the same id sequence as operations, decided by the processor in registration order like any insert. When applied, the operation's current values change under a new revision and the superseded state is kept in its append-only history (GET /operations/{id}/history); the operation id never changes. Omitted fields are unchanged; at least one of amount, effective_at, account is required. expected_revision (>= 1) makes the edit STALE_REVISION unless the operation is at that revision when decided. By default returns 202 immediately; wait_ms > 0 waits like POST /transactions and returns 200 with the decided status (APPLIED or INVALID with the rejection) if it lands in time. 403 when config.allow_edits is false for the cell; 404 for an unknown or another owner's operation."
      operationId: editOperation
      parameters:
        - description: Owner scope for the request (§2). The target must belong to this owner.
          in: header
          name: X-Owner-Id
          required: true
          schema:
            description: Owner scope for the request (§2). The target must belong to this owner.
            type: string
        - description: Client-generated UUID. Retrying with the same key never registers a second edit (G6); reusing it with a different payload is rejected with 422.
          in: header
          name: Idempotency-Key
          required: true
          schema:
            description: Client-generated UUID. Retrying with the same key never registers a second edit (G6); reusing it with a different payload is rejected with 422.
            type: string
        - description: Registration id of the operation to edit.
          in: path
          name: id
          required: true
          schema:
            description: Registration id of the operation to edit.
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditOperationInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Edit an operation in place (amount, effective_at and/or account)
      tags:
        - Editing
  /operations/{id}/history:
    get:
      description: Every state the operation has held, in revision order (the last entry is current); superseded entries name the APPLIED edit that replaced them. pending_edits and rejected_edits list undecided and INVALID edit registrations against the operation in registration-id order. 404 for an unknown id, another owner's id, or an edit registration id.
      operationId: getOperationHistory
      parameters:
        - description: Owner scope (§2).
          in: header
          name: X-Owner-Id
          required: true
          schema:
            description: Owner scope (§2).
            type: string
        - description: Operation (registration) id. Edit registration ids are not operations and yield 404.
          in: path
          name: id
          required: true
          schema:
            description: Operation (registration) id. Edit registration ids are not operations and yield 404.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationHistoryOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get an operation's append-only revision history with its pending and rejected edits
      tags:
        - Editing
  /transactions:
    post:
      description: "Registers one atomic unit: a single operation (no transaction row) or a group of 2..max_group_size legs, all belonging to one owner (§2). By default returns 202 immediately (fire-and-forget); the outcome is decided asynchronously and read back via GET /transactions/{id} or GET /operations/{id}. With wait_ms > 0 the call waits up to that budget (capped by api_max_wait_ms) for the decision via LISTEN/NOTIFY with a status-poll fallback: if the outcome is decided in time it returns 200 with the decided status, otherwise 202 with the current (still PENDING) state. Waiting is strictly optional and never guaranteed to return a final outcome."
      operationId: createTransaction
      parameters:
        - description: Owner scope for the request (§2). Single-cell deployments pass the numeric owner_id directly.
          in: header
          name: X-Owner-Id
          required: true
          schema:
            description: Owner scope for the request (§2). Single-cell deployments pass the numeric owner_id directly.
            type: string
        - description: Client-generated UUID. Retrying with the same key never duplicates operations (G6); reusing it with a different payload is rejected with 422.
          in: header
          name: Idempotency-Key
          required: true
          schema:
            description: Client-generated UUID. Retrying with the same key never duplicates operations (G6); reusing it with a different payload is rejected with 422.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTransactionOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Insert an operation or atomic group
      tags:
        - Insertion
  /transactions/{id}:
    get:
      operationId: getTransaction
      parameters:
        - description: Owner scope (§2).
          in: header
          name: X-Owner-Id
          required: true
          schema:
            description: Owner scope (§2).
            type: string
        - description: Transaction (group) id.
          in: path
          name: id
          required: true
          schema:
            description: Transaction (group) id.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTransactionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a group transaction and its per-leg statuses
      tags:
        - Queries

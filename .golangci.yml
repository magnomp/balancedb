# golangci-lint configuration (schema v2). Wired into `make lint` and CI (plan §M13).
#
# Scope is deliberately narrow: golangci-lint here is the `go vet` runner, giving
# CI one tool, one cache, and — via build-tags below — vet coverage of the
# integration/simulation sources that a bare `go vet ./...` skipped. gofumpt (the
# other plan §M13 gate) is enforced separately by the standalone `gofumpt` the repo
# already standardizes on (`make fmt`, the devcontainer's gopls), so there is a
# single formatting authority and no tool-version drift.
#
# The linter set is kept boring on purpose (plan §0). A future cleanup milestone can
# opt into the fuller `default: standard` set (errcheck/staticcheck/unused) once the
# pre-existing findings those surface across earlier milestones are addressed.
version: "2"

run:
  # Lint the build-tagged sources too: integration tests (`itest`) and the
  # DB-backed simulation (`simtest`) live behind build tags, so a plain analysis
  # (and the previous bare `go vet ./...`) skipped them. Including both tags means
  # every .go file in the tree — production and tests — is vetted.
  build-tags:
    - itest
    - simtest

linters:
  # Only govet, matching the plan §M13 "go vet enforced" requirement. Its default
  # analyzer set mirrors `go vet`.
  default: none
  enable:
    - govet
  exclusions:
    generated: lax
